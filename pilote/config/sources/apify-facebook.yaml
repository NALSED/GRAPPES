# Déclaration d'une source (fiche 01). Les CHOIX de l'utilisateur sont dans reglages.yaml, jamais ici.
id: apify-facebook
nom: Apify — Facebook (mot-clé et lieu)
description: Pages Facebook trouvées par mot-clé et lieu, par le serveur MCP d'Apify. Prestataire payant,
  clé de l'utilisateur.
trouve: pages et groupes Facebook
genres:
- compte
pays:
- monde
consomme:
- sujet
- mots_cles
- lieu
produit:
- nom
- origine
- site
usages:
- reseaux_sociaux
main: seconde
origine: web
famille: mcp
roles:
- chercher
cle: APIFY_TOKEN
cle_prefixe: 'Bearer '
cout:
  unite: résultat
  vers_dollar: 0.005
  par_appel: 25
  gratuit_par_mois: 0
confiance: 0.2
defaut:
  chercher: false
  verifier: false
avertissement: 'Prestataire payant : chaque recherche consomme des crédits de votre compte chez lui, facturés
  au résultat. Les données sont collectées sur le réseau social par le prestataire ; vérifiez ses conditions
  d''utilisation et celles du réseau. Le coût est compté dans votre plafond mensuel.'
prestataire: true
mode:
  en_ligne: true
  local: false
exemple_reponse: exemples/apify-facebook.json
verifie_le: '2026-10-13'
note: Tarif indicatif. Non vérifiée contre le service réel. L'acteur Facebook à utiliser est un RÉGLAGE
  (« actor » dans les arguments) à confirmer sur le catalogue d'Apify.
moteur:
  adaptateur: mcp_generique
  parametres:
    mcp: https://mcp.apify.com
    outil: call-actor
    cle_requise: true
    arguments:
      actor: apify/facebook-pages-scraper
      input:
        search: '{mots_et_lieu}'
        resultsLimit: '{limite}'
    champs:
      nom:
      - title
      - pageName
      - name
      site:
      - pageUrl
      - url
      - facebookUrl
    origine_texte: Facebook (page publique, via Apify)
