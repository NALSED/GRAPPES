# Déclaration d'une source (fiche 01) — copie LOCALE de GeoNames, France seule (document 22 : géocodage léger, sans moteur OSM).
id: geonames-fr
nom: GeoNames France (copie locale)
description: >-
  Noms de lieux de France (communes, quartiers, divisions administratives) avec leurs variantes et leurs coordonnées, lus dans une copie locale : aucun appel réseau. Remplace Photon et Nominatim pour retrouver un lieu par son nom.
trouve: lieux de France par leur nom
genres:
- lieu
pays:
- FR
consomme:
- sujet
- lieu
produit:
- nom
- origine
- numero
usages:
- lieux
main: seconde
origine: encyclo
fiabilite: B
famille: fichier
roles:
- chercher
cle: ''
cout:
  unite: appel
  vers_dollar: 0
  par_appel: 0
  gratuit_par_mois: 0
confiance: 0.8
defaut:
  chercher: false
  verifier: false
mode:
  en_ligne: false
  local: true
verifie_le: '2026-10-27'
attribution:
  texte: 'GeoNames (geonames.org), licence CC BY 4.0'
  url: https://www.geonames.org/
note: La colonne « détail » porte « latitude longitude ». Toutes les classes de lieux sont gardées (habités, divisions, bâtiments, monuments, relief, eaux, voies).
moteur:
  adaptateur: fichier_local
  parametres:
    base: geonames-fr
    origine: GeoNames (copie locale, France)
    installation:
      accord: 'Sednal, 27/10/2026, document 22 (ordre de travail, feu vert)'
      telechargements:
      - url: https://download.geonames.org/export/dump/FR.zip
        fichier: FR.zip
      import:
        fichiers: [FR.zip]
        format: tsv
        membre_zip: '^FR\.txt$'
        entetes: [geonameid, name, asciiname, alternatenames, latitude, longitude, fclass, fcode, country, cc2, admin1, admin2, admin3, admin4, population, elevation, dem, timezone, modification]
        colonnes:
          nom: name
          alias: [asciiname, alternatenames]
          numero: geonameid
          detail: [latitude, longitude]
          themes: fcode
        defauts: {pays: FR, genre: lieu}
        separateur_alias: ','
