# Déclaration d'une source (fiche 01) — branchée le 26/10/2026 (spécification 17, P1). Éteinte par défaut.
id: sepiasearch
nom: SepiaSearch (chaînes PeerTube)
description: Moteur de recherche des chaînes du réseau PeerTube. Sans clé.
trouve: chaînes vidéo PeerTube
genres:
- compte
pays:
- monde
consomme:
- sujet
- mots_cles
produit:
- nom
- origine
usages:
- reseaux_sociaux
main: seconde
origine: web
famille: api
roles:
- chercher
cle: ''
cout:
  unite: appel
  vers_dollar: 0
  par_appel: 1
  gratuit_par_mois: 0
confiance: 0.3
defaut:
  chercher: false
  verifier: false
mode:
  en_ligne: true
  local: false
exemple_reponse: exemples/sepiasearch.json
verifie_le: '2026-10-26'
note: Chaînes seulement, jamais une personne nommée (règle 8). Forme d'après la documentation
  publiée, pas contrôlée.
moteur:
  adaptateur: api_json
  parametres:
    url: https://sepiasearch.org/api/v1/search/video-channels
    methode: GET
    params:
      search: '{quoi}'
      count: '{limite}'
    format: json
    liste: data
    champs:
      nom: displayName
      site: url
    genre: compte
    origine_texte: PeerTube (SepiaSearch)
