# Déclaration d'une source (fiche 01). Les CHOIX de l'utilisateur sont dans reglages.yaml, jamais ici.
id: exa
nom: Exa
description: Moteur de recherche sémantique avec API (clé de l'utilisateur).
trouve: pages web
genres:
- page
pays:
- monde
consomme:
- sujet
- mots_cles
produit:
- nom
- origine
usages:
- web
main: seconde
origine: web
famille: api
roles:
- chercher
- verifier
mode:
  en_ligne: true
  local: false
verifie_le: '2026-10-13'
cle: EXA_API_KEY
cout:
  unite: requete
  vers_dollar: 0.005
  par_appel: 1
  gratuit_par_mois: 0
confiance: 0.3
defaut:
  chercher: false
  verifier: false
note: Tarif indicatif, à vérifier chez le fournisseur.
exemple_reponse: exemples/exa.json
moteur:
  definition:
    id: exa
    type: http
    public: true
    url: https://api.exa.ai/search
    method: POST
    auth:
      type: header
      name: x-api-key
      env: EXA_API_KEY
    body:
      type: json
      content:
        query: '{mots_cles}'
        numResults: '{limite}'
    response:
      format: json
      items: results
    fields:
      title: title
      url: url
      id: id
    quota: 20
    raison: résultat Exa pour « {mot_cle} »
