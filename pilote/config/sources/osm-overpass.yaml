# Déclaration d'une source (fiche 01). Les CHOIX de l'utilisateur sont dans reglages.yaml, jamais ici.
id: osm-overpass
nom: OpenStreetMap (lieux par type et par zone)
description: Les lieux d'un type donné (stade, salle de sport, centre culturel, local associatif...) dans
  une ville ou un pays, avec leurs coordonnées. Gratuit, usage équitable ; la zone vient de Nominatim.
trouve: stades, salles, centres, locaux associatifs, clubs cartographiés
genres:
- lieu
- club
pays:
- monde
consomme:
- sujet
- mots_cles
- lieu
- pays
produit:
- nom
- origine
- ville
- site
- coordonnees
usages:
- lieux
main: premiere
origine: web
famille: api
roles:
- chercher
cle: ''
cout:
  unite: appel
  vers_dollar: 0
  par_appel: 1
  gratuit_par_mois: 0
confiance: 0.4
defaut:
  chercher: true
  verifier: false
mode:
  en_ligne: true
  local: false
exemple_reponse: exemples/osm-overpass.json
verifie_le: '2026-10-13'
note: 'OpenStreetMap est rempli par des bénévoles : un grand club y figure presque toujours, un petit
  groupe informel rarement. Le type de lieu se choisit dans la page Recherches ; sans choix, il dépend
  du genre (club, association, lieu). Un appel à la fois, un délai d''une seconde, le serveur Overpass auto-hébergé
  (France) d''abord, des serveurs publics en secours.'
moteur:
  adaptateur: osm_lieux
  parametres:
    serveurs:  # dans l'ordre : le serveur auto-hébergé (France seule, outils/installer_overpass.sh), puis les serveurs publics en secours
    - http://127.0.0.1:12345/api/interpreter
    - https://overpass-api.de/api/interpreter
    - https://overpass.kumi.systems/api/interpreter
    - https://overpass.private.coffee/api/interpreter
