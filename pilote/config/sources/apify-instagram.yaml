# Déclaration d'une source (fiche 01). Les CHOIX de l'utilisateur sont dans reglages.yaml, jamais ici.
id: apify-instagram
nom: Apify — Instagram (mot-clé et lieu)
description: Comptes Instagram trouvés par mot-clé et lieu, par le serveur MCP d'Apify (acteur « instagram-scraper
  »). Prestataire payant, clé de l'utilisateur.
trouve: comptes Instagram
genres:
- compte
pays:
- monde
consomme:
- sujet
- mots_cles
- lieu
produit:
- nom
- origine
- site
usages:
- reseaux_sociaux
main: seconde
origine: web
famille: mcp
roles:
- chercher
cle: APIFY_TOKEN
cle_prefixe: 'Bearer '
cout:
  unite: résultat
  vers_dollar: 0.0023
  par_appel: 25
  gratuit_par_mois: 0
confiance: 0.2
defaut:
  chercher: false
  verifier: false
avertissement: 'Prestataire payant : chaque recherche consomme des crédits de votre compte chez lui, facturés
  au résultat. Les données sont collectées sur le réseau social par le prestataire ; vérifiez ses conditions
  d''utilisation et celles du réseau. Le coût est compté dans votre plafond mensuel.'
prestataire: true
mode:
  en_ligne: true
  local: false
exemple_reponse: exemples/apify-instagram.json
verifie_le: '2026-10-13'
note: 'Tarif indicatif (environ 2,30 $ les 1 000 résultats, à vérifier chez Apify). Non vérifiée contre
  le service réel (compte Apify requis) : le nom de l''outil MCP et les champs de l''acteur sont à confirmer
  au premier essai réel.'
moteur:
  adaptateur: mcp_generique
  parametres:
    mcp: https://mcp.apify.com
    outil: call-actor
    cle_requise: true
    arguments:
      actor: apify/instagram-scraper
      input:
        search: '{mots_et_lieu}'
        searchType: user
        searchLimit: '{limite}'
        resultsLimit: '{limite}'
    champs:
      nom:
      - fullName
      - name
      - username
      site:
      - url
      - profileUrl
    origine_texte: Instagram (compte public, via Apify)
