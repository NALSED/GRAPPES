[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grappes"
license = "MIT"
license-files = ["LICENSE"]
version = "0.1.0"
description = "Intelligence de terrain : entités rangées en grappes"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "mcp==2.3.0", "followthemoney>=4", "nomenklatura>=4", "torch", "transformers", "sentencepiece", "protobuf"]

[project.scripts]
grappes = "grappes.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# mission autocalibration (D62) : truthdiscovery s'installe avec `--no-deps` (ses versions figées sont obsolètes ; voir docs/conception/calibration.md)
# reconnaissance de noms (D63, chantier 2) : modèles existants, choisis dans config/ner.yaml ; torch CPU : --index-url https://download.pytorch.org/whl/cpu
ner = ["torch", "transformers", "sentencepiece", "protobuf"]
autocal = ["numpy", "scipy", "scikit-learn", "optuna", "pytrec_eval-terrier", "matplotlib", "bidict", "imageio"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
